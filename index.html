<body data-estilo="1" data-formato="feed">

<header class="topo">
  <div class="estilos" id="estilos" role="radiogroup" aria-label="estilo do post"></div>
</header>

<main class="palco" id="palco">
  <canvas class="arte" id="arte" role="img" width="1080" height="1350"></canvas>
</main>

<footer class="controles">
  <form class="frase" id="frase" autocomplete="off">
    <span class="antes" id="antes"></span>
    <label class="lacuna">
      <span class="so-leitor">complete a frase</span>
      <input id="lacuna" type="text" enterkeyhint="done" spellcheck="false">
    </label>
    <span class="depois" id="depois"></span>
  </form>
  <div class="acoes">
    <div class="formatos" role="group" aria-label="formato">
      <button type="button" data-formato="feed" aria-pressed="true">feed</button>
      <button type="button" data-formato="stories" aria-pressed="false">stories</button>
    </div>
    <button class="vazado" id="vazado" type="button" aria-pressed="false">sem fundo</button>
    <button class="baixar" id="baixar" type="button">baixar</button>
    <button class="vazado" id="enviar" type="button">enviar pra galeria</button>
  </div>
  <p class="aviso" id="aviso" role="status" hidden></p>
  <button class="ver-galeria" id="abrir-galeria" type="button">ver a galeria</button>
  <p class="credito">feito com muito amor y psicose democrática - por <a href="https://www.instagram.com/fefevillaca/" target="_blank" rel="noopener">@fefevillaca</a>.</p>
</footer>

<section class="galeria" id="galeria" hidden aria-label="galeria">
  <header class="galeria-topo">
    <h2>galeria</h2>
    <button class="ver-galeria" id="fechar-galeria" type="button">fechar</button>
  </header>
  <p class="galeria-estado" id="galeria-estado"></p>
  <div class="galeria-grade" id="galeria-grade"></div>
</section>

<div class="quadro" id="quadro" hidden>
  <img alt="a arte pronta">
  <p>toque e segure na imagem pra salvar</p>
  <p class="quadro-dica">não apareceu a opção? abra o site no navegador</p>
  <a class="quadro-chrome" id="abrir-chrome" href="#">abrir no Chrome</a>
  <button class="quadro-fechar" id="fechar-quadro" type="button">fechar</button>
</div>

<script data-goatcounter="https://lulygenerator.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
